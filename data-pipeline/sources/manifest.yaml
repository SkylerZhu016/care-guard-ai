manifestVersion: 2
mode: fixed-official-allowlist
generator: data-pipeline/crawl_official_medical_sources.py
corpus: backend/src/main/resources/knowledge/official-corpus.json
report: data-pipeline/corpus/crawl-report.json
runtimeNetworkAccess: false
sourcePolicy:
  allowedPublishers:
    - World Health Organization
    - U.S. Centers for Disease Control and Prevention
    - National Heart, Lung, and Blood Institute
    - National Health Service
  robotsTxtRequired: true
  patientOrForumDataAllowed: false
  unrestrictedLinkFollowing: false
  failureFallbackToFixtureContent: false
provenanceFields:
  - sourceUrl
  - finalUrl
  - fetchedAt
  - httpStatus
  - etag
  - lastModified
  - contentSha256
  - retrievalMethod
  - licenseNote
