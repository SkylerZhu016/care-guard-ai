server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:medical_preconsult;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  redis:
    enabled: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

jwt:
  secret: MedicalPreConsultPlatform2024SecretKeyForJWTTokenGeneration
  expiration-ms: 86400000

logging:
  level:
    com.medical: DEBUG
