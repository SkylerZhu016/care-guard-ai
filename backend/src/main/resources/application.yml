spring:
  application:
    name: medsim-backend
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/medsim}
    username: ${POSTGRES_USER:medsim_app}
    password: ${POSTGRES_PASSWORD:change-me-local-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
server:
  port: 8080
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  jwt-secret: ${JWT_SECRET:change-this-demo-secret-at-least-32-bytes}
  jwt-expiration-minutes: 60
  ai-base-url: ${AI_BASE_URL:http://127.0.0.1:8000}
  internal-service-token: ${INTERNAL_SERVICE_TOKEN:change-me-local-only}
  ai-job-timeout-seconds: ${AI_JOB_TIMEOUT_SECONDS:10}
  minio-endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:59000}
  minio-access-key: ${MINIO_ACCESS_KEY:minioadmin}
  minio-secret-key: ${MINIO_SECRET_KEY:change-me-local-only}
  minio-guidelines-bucket: ${MINIO_BUCKET_GUIDELINES:guidelines}
  minio-artifacts-bucket: ${MINIO_BUCKET_ARTIFACTS:artifacts}
  knowledge-seed-enabled: ${KNOWLEDGE_SEED_ENABLED:true}
  knowledge-corpus: ${KNOWLEDGE_CORPUS:classpath:knowledge/official-corpus.json}
