server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: med-platform-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/medplatform}
    username: ${DATABASE_USERNAME:med}
    password: ${DATABASE_PASSWORD:med_dev_123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

# 应用配置
app:
  jwt:
    secret: ${JWT_SECRET:d3Zk3mJ0mFbmS2VjcmV0LWZvci1kZXYtZW52aXJvbm1lbnQtb25seQ==}
    access-expiration: 7200       # 2h
    refresh-expiration: 604800    # 7d
  internal-token: ${INTERNAL_TOKEN:internal_dev_token}
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
    bucket: ${MINIO_BUCKET:medplatform}
  login:
    max-attempts: 5
    lock-minutes: 15

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    cn.edu.medplatform: INFO
    org.hibernate.SQL: WARN
