openapi: 3.1.0
info:
  title: 预问诊与随访信息服务 API
  version: 2.1.0
  description: 新问诊统一使用 v2；旧 v1 问诊写接口返回 410。
servers:
  - url: http://localhost:18088
security:
  - bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      security: []
      summary: 登录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v2/intake-catalog:
    get:
      summary: 获取版本化症状目录与动态问题
      responses:
        '200':
          description: 目录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntakeCatalog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v2/patient-profile:
    get:
      summary: 获取当前患者健康资料
      responses:
        '200':
          description: 健康资料
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatientProfileView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      summary: 保存当前患者健康资料
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatientProfileInput' }
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatientProfileView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v2/visits:
    post:
      summary: 创建 v2 草稿
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisitIntakeV2Input' }
      responses:
        '200':
          description: 草稿
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitViewV2' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v2/visits/{id}:
    parameters:
      - $ref: '#/components/parameters/VisitId'
    get:
      summary: 读取问诊；历史 v1 也以只读视图返回
      responses:
        '200':
          description: 问诊
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitViewV2' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      summary: 自动保存或更新 v2 草稿
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisitIntakeV2Input' }
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitViewV2' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v2/visits/{id}/submit:
    post:
      summary: 提交 v2 问诊
      parameters:
        - $ref: '#/components/parameters/VisitId'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: 已进入人工审核
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitViewV2' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v2/visits/{id}/analyze-complaint:
    post:
      summary: 对草稿中的原始主诉进行 AI 结构化并匹配目录标签
      description: 草稿可暂时不含症状；模型只能从服务端当前症状目录选择标签。失败时返回 FAILED 结构，不阻断草稿保存，患者可改为手动选择。
      parameters:
        - $ref: '#/components/parameters/VisitId'
      responses:
        '200':
          description: 成功结果或可降级的失败状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComplaintAnalysis' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v2/visits/{id}/complaint-structure:
    put:
      summary: 保存患者确认、删除或补充后的主诉结构
      parameters:
        - $ref: '#/components/parameters/VisitId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComplaintConfirmation' }
      responses:
        '200':
          description: 已保存确认版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComplaintAnalysis' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v2/visits/{id}/supplements:
    post:
      summary: 为已提交问诊追加补充信息
      parameters:
        - $ref: '#/components/parameters/VisitId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200': { description: 已追加 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v2/visits/mine:
    get:
      summary: 当前患者的全部问诊
      responses:
        '200':
          description: 问诊列表
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/VisitViewV2' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v2/clinician/visits:
    get:
      summary: 医务人员待审队列
      responses:
        '200':
          description: 待审问诊
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/VisitViewV2' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/triage-results/{id}/review:
    post:
      summary: 医务人员人工终审
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '200': { description: 已终审 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/followup-plans:
    post:
      summary: 创建通用随访计划草稿
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitId, templateCode]
              properties:
                visitId: { type: string, format: uuid }
                templateCode: { type: string, const: GENERAL_FOLLOWUP_V1 }
      responses:
        '200': { description: 已创建 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/visits:
    post:
      deprecated: true
      summary: 已停用的 v1 写接口
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410': { $ref: '#/components/responses/Gone' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/visits/{id}/intake:
    put:
      deprecated: true
      summary: 已停用的 v1 更新接口
      parameters:
        - $ref: '#/components/parameters/VisitId'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410': { $ref: '#/components/responses/Gone' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/visits/{id}/submit:
    post:
      deprecated: true
      summary: 已停用的 v1 提交接口
      parameters:
        - $ref: '#/components/parameters/VisitId'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410': { $ref: '#/components/responses/Gone' }
        '500': { $ref: '#/components/responses/InternalServerError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    VisitId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: 请求格式、参数或业务前置条件无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            timestamp: '2026-07-24T10:00:00+08:00'
            requestId: 29c6f765-392d-4c69-9be5-f9f4207293b6
            code: COMMON_VALIDATION_FAILED
            message: 输入校验失败
            fieldErrors:
              - field: chiefComplaint
                code: NotBlank
    Unauthorized:
      description: 未登录、登录凭据无效或访问令牌失效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            timestamp: '2026-07-24T10:00:00+08:00'
            requestId: b10ffbac-cd12-46c5-a2de-ad44c83943b1
            code: AUTH_UNAUTHORIZED
            message: 请先登录
            fieldErrors: []
    Forbidden:
      description: 已登录，但角色或资源权限不足
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            timestamp: '2026-07-24T10:00:00+08:00'
            requestId: e1d76a8f-4d29-4c89-b041-b3b2ce435e80
            code: AUTH_FORBIDDEN
            message: 无权执行该操作
            fieldErrors: []
    NotFound:
      description: 资源不存在，或资源所有权校验不通过
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            timestamp: '2026-07-24T10:00:00+08:00'
            requestId: d7d8fd7f-1ea2-47fd-8cc1-94c7870f946d
            code: RESOURCE_NOT_FOUND
            message: 资源不存在或无权访问
            fieldErrors: []
    Conflict:
      description: 当前资源状态不允许执行请求，例如问诊已提交、状态迁移非法或尝试降低规则等级
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            timestamp: '2026-07-24T10:00:00+08:00'
            requestId: 0c3d1d3b-d060-42cd-894c-91068b306ed8
            code: VISIT_INVALID_TRANSITION
            message: 不允许的病例状态迁移
            fieldErrors: []
    Gone:
      description: 旧版问诊写接口已停用
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            timestamp: '2026-07-24T10:00:00+08:00'
            requestId: 2a97d063-9041-42d4-9264-8f3e5456298e
            code: INTAKE_V1_DEPRECATED
            message: 旧版问诊写接口已停用，请使用 /api/v2/visits
            fieldErrors: []
    InternalServerError:
      description: 服务内部错误；响应不会包含堆栈、密钥或原始敏感数据
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            timestamp: '2026-07-24T10:00:00+08:00'
            requestId: c97e3685-1e56-48e9-a59a-031b42f90269
            code: INTERNAL_ERROR
            message: 系统暂时不可用，请稍后重试
            fieldErrors: []
  schemas:
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: 校验失败的请求字段
        code:
          type: string
          description: Bean Validation 或输入解析错误代码
    ErrorResponse:
      type: object
      required: [timestamp, requestId, code, message, fieldErrors]
      properties:
        timestamp: { type: string, format: date-time }
        requestId:
          type: string
          description: 本次错误响应的追踪标识
        code:
          type: string
          description: 稳定的机器可读错误码
          examples:
            - COMMON_VALIDATION_FAILED
            - AUTH_UNAUTHORIZED
            - AUTH_FORBIDDEN
            - RESOURCE_NOT_FOUND
            - VISIT_INVALID_TRANSITION
            - INTAKE_V1_DEPRECATED
            - INTERNAL_ERROR
        message:
          type: string
          description: 面向用户的中文错误说明
        fieldErrors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [PATIENT, CLINICIAN, FOLLOWUP_STAFF, ADMIN] }
    IntakeCatalog:
      type: object
      required: [version, symptoms]
      properties:
        version: { type: string }
        symptoms:
          type: array
          items: { $ref: '#/components/schemas/CatalogSymptom' }
    CatalogSymptom:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        category: { type: string }
        supportLevel: { $ref: '#/components/schemas/SupportLevel' }
        common: { type: boolean }
        questions:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              prompt: { type: string }
              type: { type: string }
              multiple: { type: boolean }
              options:
                type: array
                items:
                  type: object
                  properties:
                    value: { type: string }
                    label: { type: string }
    SupportLevel:
      type: string
      enum: [RULE_SUPPORTED, RECORD_ONLY, CUSTOM]
    PatientProfileInput:
      type: object
      properties:
        ageBand: { type: string, enum: [CHILD, ADOLESCENT, ADULT, OLDER_ADULT, UNKNOWN] }
        physiologicalInfoStatus: { $ref: '#/components/schemas/ProfileFieldStatus' }
        physiologicalInfo:
          type: string
          description: >-
            患者点击选项后生成的 JSON 字符串，不接受任意生理信息自由描述。
            birthSex 可为 MALE、FEMALE、INTERSEX_OR_OTHER、UNKNOWN、PREFER_NOT_TO_SAY；
            reproductiveStatus 可为 NOT_APPLICABLE、NOT_PREGNANT、POSSIBLY_PREGNANT、
            PREGNANT、POSTPARTUM_SIX_WEEKS、BREASTFEEDING、UNKNOWN、PREFER_NOT_TO_SAY。
          example: '{"birthSex":"FEMALE","reproductiveStatus":"PREGNANT"}'
        chronicConditionsStatus: { $ref: '#/components/schemas/ProfileFieldStatus' }
        chronicConditions: { type: array, items: { type: string } }
        allergiesStatus: { $ref: '#/components/schemas/ProfileFieldStatus' }
        allergies: { type: array, items: { type: string } }
        longTermMedicationsStatus: { $ref: '#/components/schemas/ProfileFieldStatus' }
        longTermMedications: { type: array, items: { type: string } }
    ProfileFieldStatus:
      type: string
      enum: [NONE, UNKNOWN, PROVIDED]
    PatientProfileView:
      type: object
      properties:
        id: { type: [string, 'null'], format: uuid }
        ownerId: { type: string, format: uuid }
        version: { type: integer }
        data: { $ref: '#/components/schemas/PatientProfileInput' }
        updatedAt: { type: [string, 'null'], format: date-time }
    VisitIntakeV2Input:
      type: object
      required: [chiefComplaint]
      description: 草稿阶段只要求原始主诉；提交时服务端额外要求至少一项症状和有效的主要症状。
      properties:
        primarySymptomCode: { type: [string, 'null'] }
        chiefComplaint: { type: string, minLength: 1, maxLength: 500 }
        freeText:
          type: string
          maxLength: 2000
          deprecated: true
          description: 仅用于兼容已有草稿；新版患者端不再提供独立补充输入框。
        symptomReports:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/SymptomReportInput' }
    SymptomReportInput:
      type: object
      required: [symptomCode]
      properties:
        symptomCode: { type: string }
        customName: { type: string, maxLength: 100 }
        source:
          type: string
          enum: [USER_SELECTED, AI_EXTRACTED, CATALOG, RELATED_ANSWER, CUSTOM]
          description: AI 自动匹配使用 AI_EXTRACTED，患者手选使用 USER_SELECTED；CATALOG 仅为早期 v2 草稿兼容值。
        onsetRange: { type: string, enum: [JUST_NOW, TODAY, ONE_TO_THREE_DAYS, MORE_THAN_THREE_DAYS, UNKNOWN] }
        course: { type: string, enum: [CONTINUOUS, INTERMITTENT, RELIEVED, UNKNOWN] }
        currentStatus: { type: string, enum: [PRESENT, NOT_PRESENT, UNKNOWN] }
        activityImpact: { type: string, enum: [NO_IMPACT, NEEDS_REST, UNABLE_NORMAL_ACTIVITY, UNKNOWN] }
        answers:
          type: array
          items:
            type: object
            properties:
              questionId: { type: string }
              selectedOptions: { type: array, items: { type: string } }
              supplementalText: { type: string }
    VisitViewV2:
      type: object
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        status: { type: string }
        intakeVersion: { type: string, enum: [INTAKE_V1, INTAKE_V2] }
        primarySymptomCode: { type: string }
        chiefComplaint: { type: string }
        freeText: { type: string }
        symptomReports: { type: array, items: { $ref: '#/components/schemas/SymptomReportInput' } }
        profileSnapshot: { $ref: '#/components/schemas/PatientProfileInput' }
        complaintAnalysis: { $ref: '#/components/schemas/ComplaintAnalysis' }
        triage: { $ref: '#/components/schemas/TriageV2' }
        createdAt: { type: string, format: date-time }
        submittedAt: { type: string, format: date-time }
    TriageV2:
      type: object
      properties:
        id: { type: string, format: uuid }
        ruleUrgency: { type: [string, 'null'], enum: [ROUTINE, URGENT, EMERGENCY, null] }
        aiUrgency: { type: [string, 'null'] }
        finalUrgency: { type: [string, 'null'] }
        coverageStatus: { type: string, enum: [FULL, PARTIAL, NONE] }
        assessmentStatus: { type: string, enum: [RULE_EVALUATED, REQUIRES_MANUAL_REVIEW] }
        ruleReasons: { type: array, items: { type: string } }
        aiSummary: { type: string }
        aiSupport: { $ref: '#/components/schemas/AiClinicalSupport' }
    ComplaintTag:
      type: object
      required: [code, displayName, category, source, confirmationStatus]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]+$' }
        displayName: { type: string, maxLength: 100 }
        category: { type: string, maxLength: 60 }
        source: { type: string, enum: [user_selected, ai_extracted] }
        confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        evidenceText: { type: string, maxLength: 300 }
        confirmationStatus: { type: string, enum: [proposed, confirmed, removed] }
    ComplaintFacts:
      type: object
      properties:
        duration: { type: string }
        onset: { type: string }
        location: { type: string }
        character: { type: string }
        aggravatingFactors: { type: array, items: { type: string } }
        relievingFactors: { type: array, items: { type: string } }
        associatedSymptoms: { type: array, items: { type: string } }
        activityImpact: { type: string }
    ComplaintAnalysis:
