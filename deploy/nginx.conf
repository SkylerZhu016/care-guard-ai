server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location /api/ { proxy_pass http://backend:8080; proxy_set_header X-Request-Id $request_id; proxy_set_header Host $host; }
  location /actuator/ { proxy_pass http://backend:8080; }
  location /v3/api-docs { proxy_pass http://backend:8080; }
  location /swagger-ui/ { proxy_pass http://backend:8080; }
  location / { try_files $uri $uri/ /index.html; }
}

